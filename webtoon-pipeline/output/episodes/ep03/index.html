      if (b.dataset.tx==='') return;
      const tx = +b.dataset.tx/100*W, ty = +b.dataset.ty/100*H;
      const dx = tx-cx, dy = ty-cy, d = Math.hypot(dx,dy)||1;
      if (b.dataset.k==='th'){
        for (const [f,r] of [[.62,5],[.78,3.5],[.9,2.3]]){
          const px = cx+dx*f, py = cy+dy*f;
          out += `<circle cx="${px}" cy="${py}" r="${r}" fill="#fff" stroke="#111" stroke-width="1.8"/>`;
        }
        return;
      }
      const nx = -dy/d, ny = dx/d, half = Math.min(9, bw*.12);
      const x1 = cx+nx*half, y1 = cy+ny*half, x2 = cx-nx*half, y2 = cy-ny*half;
      if (b.dataset.k==='off'){
        const mx = cx+dx*.55, my = cy+dy*.55;
        out += `<path d="M${x1},${y1} L${mx+nx*10},${my+ny*10} L${mx-nx*4},${my-ny*4} L${tx},${ty} L${mx-nx*12},${my-ny*12} L${mx+nx*2},${my+ny*2} L${x2},${y2} Z" fill="#fff" stroke="#111" stroke-width="2.2" stroke-linejoin="round"/>`;
      } else {
        out += `<path d="M${x1},${y1} Q${cx+dx*.55+nx*4},${cy+dy*.55+ny*4} ${tx},${ty} Q${cx+dx*.55-nx*4},${cy+dy*.55-ny*4} ${x2},${y2} Z" fill="#fff" stroke="#111" stroke-width="2.2" stroke-linejoin="round"/>`;
      }
    });
    svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
    svg.innerHTML = out;
  });
}
let pending = 0;
document.querySelectorAll('.panel img').forEach(im=>{ if(!im.complete){ pending++; im.addEventListener('load',()=>{ layout(); }); } });
window.addEventListener('resize', layout);
document.fonts && document.fonts.ready.then(layout);
layout();
document.getElementById('tool').onclick = () => document.body.classList.toggle('ids');
</script>
